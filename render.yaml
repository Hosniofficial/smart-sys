services:
  - type: web
    name: smartsys-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_BASE_PATH
        value: ""
      - key: HTTPS_ENFORCEMENT_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: ADMIN_API_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: VERIFY_IDENTITY
      - key: DB_SSL_CA
        value: /var/www/html/certs/aiven-project-ca.pem
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TWO_FA_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: REFRESH_COOKIE_PATH
        value: /api/v1/auth
      - key: LOG_LEVEL
        value: info
