<VirtualHost *:${APACHE_LISTEN_PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public
    DirectorySlash Off

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectorySlash Off
    </Directory>

    # Uploaded assets (logos) are static files only. Never execute anything from this tree, even if
    # a script were to be written here, and neutralise active content such as SVG/HTML.
    <Directory /var/www/html/public/uploads>
        AllowOverride None
        Options -Indexes -ExecCGI
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
        <IfModule mod_php8.c>
            php_admin_flag engine off
        </IfModule>
        <FilesMatch "(?i)\.(php[0-9]?|phtml|pht|phar|shtml|cgi|pl|py)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox"
        </IfModule>
    </Directory>
</VirtualHost>
